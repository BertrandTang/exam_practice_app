# Infrastructure Render (Blueprint) : 2 environnements × (API + frontend).
#
#   Préproduction (branche develop)        Production (branche main)
#   staging.todo.bazardim.fr               todo.bazardim.fr
#   └─ /api/* → todo-api-staging-gs7r.onrender.com  └─ /api/* → todo-api-prod-cob9.onrender.com
#
# Le frontend relaie /api/* vers l'API (rewrite Render) : un seul domaine par
# environnement, donc cookie de session interne au site (SameSite=Lax) et pas
# de cookie tiers. L'offre gratuite limite à 2 domaines personnalisés.
#
# Les déploiements sont déclenchés par la CI (deploy hooks), pas à chaque commit.
# Secrets : MONGO_URI est saisi dans le dashboard (sync: false) ;
# JWT_SECRET et METRICS_TOKEN sont générés aléatoirement par Render.

services:
  # ------------------------------------------------------------ Préproduction
  - type: web
    name: todo-api-staging
    runtime: docker
    plan: free
    region: frankfurt
    branch: develop
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: APP_ENV
        value: staging
      - key: CORS_ORIGIN
        value: https://staging.todo.bazardim.fr
      # Proxys de confiance : réseau interne Render, Cloudflare (CDN de Render) et
      # relais /api du frontend (74.220.48.0/24). req.ip = IP réelle du client.
      - key: TRUST_PROXY
        value: 'uniquelocal, 173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18, 190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22, 74.220.48.0/24'
      - key: LOG_LEVEL
        value: debug

  - type: web
    name: todo-front-staging
    runtime: static
    branch: develop
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: 'off'
    domains:
      - staging.todo.bazardim.fr
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: VITE_API_URL
        value: /api
    routes:
      # L'API est servie sous le même domaine que le frontend (proxy Render) :
      # le cookie de session reste interne au site, sans CORS ni cookie tiers.
      - type: rewrite
        source: /api/*
        destination: https://todo-api-staging-gs7r.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # --------------------------------------------------------------- Production
  - type: web
    name: todo-api-prod
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: APP_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://todo.bazardim.fr
      # Proxys de confiance : réseau interne Render, Cloudflare (CDN de Render) et
      # relais /api du frontend (74.220.48.0/24). req.ip = IP réelle du client.
      - key: TRUST_PROXY
        value: 'uniquelocal, 173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18, 190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22, 74.220.48.0/24'
      - key: LOG_LEVEL
        value: info

  - type: web
    name: todo-front-prod
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: 'off'
    domains:
      - todo.bazardim.fr
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: VITE_API_URL
        value: /api
    routes:
      # L'API est servie sous le même domaine que le frontend (proxy Render) :
      # le cookie de session reste interne au site, sans CORS ni cookie tiers.
      - type: rewrite
        source: /api/*
        destination: https://todo-api-prod-cob9.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
