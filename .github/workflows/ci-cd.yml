# Pipeline CI/CD
#
# - Pull request vers develop / main : lint, format, tests, audit, build (sans déploiement)
# - Push sur develop : tout ce qui précède + images Docker poussées sur GHCR
#                      + déploiement de la PRÉPRODUCTION sur Render
# - Push sur main    : idem, déploiement de la PRODUCTION après approbation manuelle
#                      (environnement GitHub "production" avec relecteur obligatoire)
name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, tests, audit, docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Tests (node:test + Supertest)
        run: npm test
        env:
          MONGO_URI_TEST: mongodb://localhost:27017/todo_test
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
      - name: Génération de la documentation JSDoc
        run: npm run docs
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-api
          path: backend/docs

  frontend:
    name: Frontend — lint, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Image Docker — ${{ matrix.service }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Connexion à GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags de l'image (branche ou PR + SHA du commit)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          # {{branch}} est vide sur une pull request : préfixe pr-<numéro> dans ce cas.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=pr-${{ github.event.number }}-,enable=${{ github.event_name == 'pull_request' }}
      - name: Build (et push sur GHCR lors d'un push)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Déploiement — ${{ github.ref_name == 'main' && 'production' || 'préproduction' }}
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Déclencher le déploiement de l'API sur Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK_API absent : déploiement ignoré (Render pas encore configuré)."
            exit 0
          fi
          case "$HOOK" in
            https://api.render.com/deploy/srv-*) ;;
            *)
              echo "::error::Secret RENDER_DEPLOY_HOOK_API mal formé : attendu l'URL complète du deploy hook (https://api.render.com/deploy/srv-…?key=…)."
              exit 1
              ;;
          esac
          curl -fsS -X POST "$HOOK" > /dev/null
      - name: Déclencher le déploiement du frontend sur Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONT }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK_FRONT absent : déploiement ignoré (Render pas encore configuré)."
            exit 0
          fi
          case "$HOOK" in
            https://api.render.com/deploy/srv-*) ;;
            *)
              echo "::error::Secret RENDER_DEPLOY_HOOK_FRONT mal formé : attendu l'URL complète du deploy hook (https://api.render.com/deploy/srv-…?key=…)."
              exit 1
              ;;
          esac
          curl -fsS -X POST "$HOOK" > /dev/null
